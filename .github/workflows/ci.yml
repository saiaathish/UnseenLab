name: CI

on:
  push:
    branches:
      - 'feature/*'
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # playwright.config.ts's webServer runs `npm run start -- -p 3100`
      # (i.e. `next start`), which requires a build to exist. Playwright's
      # webServer does NOT build, so this job re-runs the build itself:
      # slower but self-contained (no artifact handoff between jobs).
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan for API keys (sk- followed by 20+ chars)
        run: |
          # git grep scans only tracked files (what CI actually checks out).
          # .github/ is excluded because this workflow file itself contains the
          # pattern literals. Actual key values are still caught everywhere,
          # including docs and .env.example.
          if git grep -n -i -E 'sk-[a-z0-9]{20,}' -- . ':(exclude).github'; then
            echo "::error::Possible API key (sk- followed by 20+ chars) found in tracked files."
            exit 1
          fi
          echo "OK: no sk- style API keys found."
      - name: Scan for Firebase service account / Mongo URI / OAuth client secret assignments
        run: |
          # Flag ASSIGNMENTS of these names (a real leak: NAME=value or
          # "name":"value"), not bare name reads — scripts/e2e-seed-auth.mjs
          # must legitimately read process.env.FIREBASE_SERVICE_ACCOUNT and
          # process.env.MONGODB_URI at runtime (reading env is fine; this
          # scan forbids tracked-file ASSIGNMENTS), and .env.example/*.md
          # legitimately warn against committing the names.
          if git grep -n -i -E '(FIREBASE_SERVICE_ACCOUNT|FIREBASE_PRIVATE_KEY|GOOGLE_CLIENT_SECRET|MONGODB_URI)[^A-Za-z0-9_]*[:=]' -- . ':(exclude).github' ':(exclude)*.md'; then
            echo "::error::Forbidden secret assignment found in tracked files."
            exit 1
          fi
          echo "OK: no forbidden secret assignments found."
      - name: Fail if a .env file other than .env.example is tracked
        run: |
          if git ls-files '.env*' | grep -v 'example'; then
            echo "::error::A .env file other than .env.example is tracked in git."
            git ls-files '.env*' | grep -v 'example'
            exit 1
          fi
          echo "OK: only .env.example is tracked."
